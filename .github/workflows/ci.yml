name: CI/CD — Civic Reporting App

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend: lint + build ──────────────────────────────
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_NAME: civic_reporting
          JWT_SECRET: ci-secret-placeholder
          JWT_REFRESH_SECRET: ci-refresh-placeholder

  # ── Frontend: lint + build ─────────────────────────────
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://civic-reporting-api.onrender.com/api/v1
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}

  # ── Deploy to Render (main branch only) ───────────────
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render backend deploy
        run: |
          curl -s -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print('Deploy triggered:', d.get('id','ok'))"

      - name: Trigger Render frontend deploy
        run: |
          curl -s -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print('Deploy triggered:', d.get('id','ok'))"

      - name: Deployment summary
        run: |
          echo "✅ Backend + Frontend deploys triggered on Render"
          echo "🔗 Backend:  https://civic-reporting-api.onrender.com"
          echo "🔗 Frontend: https://civic-reporting-app.onrender.com"
