services:
  # ── Backend API ───────────────────────────────────────────
  - type: web
    name: civic-reporting-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DB_HOST
        value: aws-0-eu-west-1.pooler.supabase.com
      - key: DB_PORT
        value: 6543
      - key: DB_USERNAME
        value: postgres.yckasecazpyfmihpjsro
      - key: DB_PASSWORD
        value: "Civic@Report2024!"
      - key: DB_NAME
        value: postgres
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://civic-reporting-frontend.onrender.com

  # ── Frontend Static Site ──────────────────────────────────
  - type: web
    name: civic-reporting-frontend
    runtime: static
    region: frankfurt
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://civic-reporting-api.onrender.com/api/v1
